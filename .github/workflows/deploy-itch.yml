name: Deploy to itch.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Your Convex prod URL (set in repo Settings > Secrets and variables > Actions)
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      # Itch.io API key (set as BUTLER_API_KEY secret)
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # Change to your itch.io target: <account or org>/<project>:<channel>
      ITCH_TARGET: wybert/ai-companion-town:html5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (relative base for itch iframe)
        run: npx vite build --base=./

      - name: Download and setup butler
        run: |
          # Download butler with error handling and debugging
          set -e  # Exit on any error

          echo "Attempting to download butler..."
          echo "Testing butler download URL..."

          # Test the URL first and show what we're getting
          curl -v -L -o butler_test.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default || true
          echo "Downloaded file info:"
          ls -la butler_test.zip || true
          file butler_test.zip || true
          echo "First 100 characters of downloaded file:"
          head -c 100 butler_test.zip || true
          echo ""

          # If it's actually a zip file, proceed
          if file butler_test.zip | grep -q "Zip archive data"; then
            echo "Valid zip file detected, extracting..."
            mv butler_test.zip butler.zip
            unzip -o butler.zip
            chmod +x butler
            echo "Butler installed successfully"
          else
            echo "Download failed, file is not a zip archive"
            echo "Trying without LATEST redirect..."
            # Try with explicit version
            curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/15.24.0/archive/default || {
              echo "Explicit version failed too. Using fallback approach..."
              # Create a simple script that shows error and exits gracefully for now
              echo '#!/bin/bash' > butler
              echo 'echo "Butler download failed. Please check itch.io butler distribution."' >> butler
              echo 'exit 1' >> butler
              chmod +x butler
            }
          fi

          echo "Testing butler installation:"
          ./butler -V || echo "Butler verification failed"

      - name: Publish to itch.io
        run: |
          # Use butler to push to itch.io
          ./butler push dist "${{ env.ITCH_TARGET }}" --userversion="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
