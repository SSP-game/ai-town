name: Deploy to itch.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Your Convex prod URL (set in repo Settings > Secrets and variables > Actions)
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      # Itch.io API key (set as BUTLER_API_KEY secret)
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # Change to your itch.io target: <account or org>/<project>:<channel>
      ITCH_TARGET: wybert/ai-companion-town:html5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (relative base for itch iframe)
        run: npx vite build --base=./
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Setup butler from local file
        run: |
          # Use the local butler zip file from itch directory
          echo "Setting up butler from local itch/butler-linux-amd64.zip..."

          # Check if the local butler file exists
          if [ -f "itch/butler-linux-amd64.zip" ]; then
            echo "Found local butler file ($(du -h itch/butler-linux-amd64.zip | cut -f1))"

            # Extract butler from the zip file
            unzip -o itch/butler-linux-amd64.zip

            # Make butler executable
            chmod +x butler

            # Verify installation
            echo "Butler version:"
            ./butler -V

            echo "Butler setup completed successfully!"
          else
            echo "Error: Local butler file not found at itch/butler-linux-amd64.zip"
            ls -la itch/ || echo "itch directory not found"
            exit 1
          fi

      - name: Publish to itch.io
        run: |
          # Use butler to push to itch.io
          ./butler push dist "${{ env.ITCH_TARGET }}" --userversion="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
