name: Deploy to itch.io

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Your Convex prod URL (set in repo Settings > Secrets and variables > Actions)
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      # Itch.io API key (set as BUTLER_API_KEY secret)
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # Change to your itch.io target: <account or org>/<project>:<channel>
      ITCH_TARGET: wybert/ai-companion-town:html5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (relative base for itch iframe)
        run: npx vite build --base=./

      - name: Publish to itch.io (butler action)
        uses: josephbmanley/butler-publish-itchio-action@master
        with:
          api_key: ${{ secrets.BUTLER_API_KEY }}
          user: wybert
          game: ai-companion-town
          channel: html5
          files: dist
          # Optional: use tag/commit as userversion
          user_version: ${{ github.ref_name }}
